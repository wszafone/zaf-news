<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 배경: 밝은 하늘색 -->
  <rect width="64" height="64" rx="14" fill="#e8f0fe"/>

  <!-- 신문 본체 (흰색 카드) -->
  <rect x="10" y="12" width="44" height="40" rx="4" fill="#ffffff"/>

  <!-- 헤드라인 바 (파란색) -->
  <rect x="10" y="12" width="44" height="12" rx="4" fill="#1a73e8"/>
  <rect x="10" y="20" width="44" height="4" fill="#1a73e8"/>

  <!-- 헤드라인 텍스트 줄 (흰색) -->
  <rect x="15" y="16" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
  <rect x="38" y="16" width="10" height="3" rx="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- 본문 줄들 (파란색 계열) -->
  <rect x="15" y="29" width="34" height="2.5" rx="1.25" fill="#1a73e8"/>
  <rect x="15" y="34" width="30" height="2.5" rx="1.25" fill="#4a90d9"/>
  <rect x="15" y="39" width="34" height="2.5" rx="1.25" fill="#4a90d9"/>
  <rect x="15" y="44" width="22" height="2.5" rx="1.25" fill="#7ab0e8"/>
</svg>
